name: Pruebas importador ICFES

on:
  push:
    branches:
      - premium/visual-3d-2026-11
    paths:
      - "scripts/import_icfes_saber11.py"
      - "tests/test_import_icfes_saber11.py"
      - ".github/workflows/test-icfes-importer.yml"
  pull_request:
    paths:
      - "scripts/import_icfes_saber11.py"
      - "tests/test_import_icfes_saber11.py"
      - ".github/workflows/test-icfes-importer.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar sintaxis
        run: python -m py_compile scripts/import_icfes_saber11.py tests/test_import_icfes_saber11.py
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
